<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="./js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Attendance Log - P2MT</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="./css/main.css">
  <style>
    .code-badge { display:inline-block; padding:3px 10px; border-radius:10px; font-weight:700; font-size:12px; }
    .code-U  { background:#FEE2E2; color:#991B1B; }
    .code-T  { background:#FEF3C7; color:#92400E; }
    .code-E  { background:#DBEAFE; color:#1D4ED8; }
    .excuse-PE { background:#D1FAE5; color:#065F46; padding:2px 8px; border-radius:8px; font-size:11px; font-weight:700; }
    .excuse-DE { background:#EDE9FE; color:#5B21B6; padding:2px 8px; border-radius:8px; font-size:11px; font-weight:700; }
    .grid-stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-bottom:16px; }
    .stat-card { background:white; padding:16px; border-radius:8px; box-shadow:0 2px 4px rgba(0,0,0,.1); display:flex; gap:12px; align-items:center; }
    .stat-icon { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; }
    .stat-icon.blue   { background:#E3F2FD; color:#2196F3; }
    .stat-icon.red    { background:#FFEBEE; color:#F44336; }
    .stat-icon.yellow { background:#FEF3C7; color:#F59E0B; }
    .stat-icon.green  { background:#D1FAE5; color:#10B981; }
    .stat-value { font-size:24px; font-weight:700; color:#333; }
    .stat-label { font-size:12px; color:#999; margin-top:4px; }
    .filter-card { background:white; box-shadow:0 2px 4px rgba(0,0,0,.1); }
    .action-button { margin:2px; font-size:.9rem; }
    .code-Lab { background:#f3e8ff; color:#6d28d9; }
    .lab-row   { background:#faf5ff !important; }
    .lab-badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; color:#7c3aed; background:#ede9fe; padding:2px 7px; border-radius:10px; }
  </style>
</head>
<body>
  <div id="nav-container"></div>

  <div class="page-container">
    <!-- Header -->
    <div class="page-header">
      <h1><i class="fas fa-calendar-check"></i> Daily Attendance Log</h1>
      <div class="actions">
        <button onclick="openAddRecordModal()" class="w3-button btn-primary action-button">
          <i class="fas fa-plus"></i> Log Attendance
        </button>
        <button id="btn-download-csv" class="w3-button btn-secondary action-button">
          <i class="fas fa-download"></i> Download CSV
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid-stats" id="stats-row">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fas fa-list"></i></div>
        <div><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total Records</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red"><i class="fas fa-times-circle"></i></div>
        <div><div class="stat-value" id="stat-unexcused">0</div><div class="stat-label">Unexcused (U)</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon yellow"><i class="fas fa-clock"></i></div>
        <div><div class="stat-value" id="stat-tardy">0</div><div class="stat-label">Tardy (T)</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="fas fa-file-medical"></i></div>
        <div><div class="stat-value" id="stat-excused">0</div><div class="stat-label">Excused (E / PE / DE)</div></div>
      </div>
      <div class="stat-card" id="stat-lab-card" style="display:none;">
        <div class="stat-icon" style="background:#f3e8ff;color:#7c3aed;"><i class="fas fa-flask"></i></div>
        <div><div class="stat-value" id="stat-lab">0</div><div class="stat-label">Learning Lab Sessions</div></div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar filter-card w3-margin-bottom">
      <div class="w3-row">
        <div class="w3-col m2 w3-padding-small">
          <label class="form-label">Start Date</label>
          <input type="date" id="filter-start" class="w3-input w3-border">
        </div>
        <div class="w3-col m2 w3-padding-small">
          <label class="form-label">End Date</label>
          <input type="date" id="filter-end" class="w3-input w3-border">
        </div>
        <div class="w3-col m3 w3-padding-small">
          <label class="form-label">Student</label>
          <input type="text" id="filter-student" class="w3-input w3-border" placeholder="Name or A#…">
        </div>
        <div class="w3-col m2 w3-padding-small">
          <label class="form-label">Teacher</label>
          <select id="filter-teacher" class="w3-select w3-border">
            <option value="">All Teachers</option>
          </select>
        </div>
        <div class="w3-col m2 w3-padding-small">
          <label class="form-label">Code</label>
          <select id="filter-code" class="w3-select w3-border">
            <option value="">All (T/U/E)</option>
            <option value="U">Unexcused (U)</option>
            <option value="T">Tardy (T)</option>
            <option value="E">Excused (E)</option>
          </select>
        </div>
        <div class="w3-col m1 w3-padding-small" style="padding-top:28px;">
          <button id="btn-apply" class="w3-button btn-primary w3-block"><i class="fas fa-filter"></i></button>
        </div>
      </div>
      <div class="w3-row w3-margin-top">
        <div class="w3-col m12 w3-padding-small" style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
          <button id="btn-clear" class="w3-button btn-ghost"><i class="fas fa-times"></i> Clear</button>
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; font-weight:600; color:#6d28d9; user-select:none;">
            <input type="checkbox" id="filter-include-labs" style="width:16px;height:16px;accent-color:#7c3aed;">
            <i class="fas fa-flask" style="font-size:13px;"></i> Include Learning Lab Sessions
          </label>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <div id="loading-container" class="loading-container" style="display:none;">
        <div class="loading-text"><div class="spinner"></div><span>Loading attendance records…</span></div>
      </div>
      <table id="attendanceTable" class="w3-table w3-striped w3-bordered" style="width:100%;">
        <thead class="w3-blue">
          <tr>
            <th>Date</th>
            <th>Student</th>
            <th>A#</th>
            <th>Code</th>
            <th>Class</th>
            <th>Teacher</th>
            <th>Excuse</th>
            <th>Comment</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="attendance-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- Excuse Modal -->
  <div id="excuseModal" class="w3-modal" onclick="if(event.target===this)closeExcuseModal()">
    <div class="w3-modal-content w3-card" style="max-width:460px;">
      <button class="modal-close-btn" onclick="closeExcuseModal()">×</button>
      <div class="modal-body">
        <h3><i class="fas fa-file-alt"></i> Add / Edit Excuse</h3>
        <input type="hidden" id="excuse-log-id">
        <div id="excuse-student-info" style="font-weight:600; margin-bottom:12px;"></div>

        <label class="form-label">Excuse Type</label>
        <div style="display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap;">
          <label style="cursor:pointer; display:flex; align-items:center; gap:6px;">
            <input type="radio" name="excuseType" value="" checked> <span>None</span>
          </label>
          <label style="cursor:pointer; display:flex; align-items:center; gap:6px;">
            <input type="radio" name="excuseType" value="PE">
            <span class="excuse-PE">PE</span> Parent Excuse
          </label>
          <label style="cursor:pointer; display:flex; align-items:center; gap:6px;">
            <input type="radio" name="excuseType" value="DE">
            <span class="excuse-DE">DE</span> Doctor Excuse
          </label>
        </div>

        <label class="form-label">Notes (optional)</label>
        <textarea id="excuse-notes" class="w3-input w3-border w3-margin-bottom" rows="3"
          placeholder="Parent called, doctor note received, etc."></textarea>

        <div class="w3-row">
          <div class="w3-col m6 w3-padding-small">
            <button class="w3-button btn-primary w3-block" onclick="saveExcuse()">
              <i class="fas fa-save"></i> Save Excuse
            </button>
          </div>
          <div class="w3-col m6 w3-padding-small">
            <button class="w3-button btn-ghost w3-block" onclick="closeExcuseModal()">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add / Edit Attendance Record Modal -->
  <div id="addRecordModal" class="w3-modal" onclick="if(event.target===this)closeAddRecordModal()">
    <div class="w3-modal-content w3-card" style="max-width:520px;">
      <button class="modal-close-btn" onclick="closeAddRecordModal()">×</button>
      <div class="modal-body">
        <input type="hidden" id="edit-record-id">
        <h3 id="add-record-title"><i class="fas fa-plus-circle"></i> Log Attendance Record</h3>

        <label class="form-label">Student Name</label>
        <input type="text" id="add-student-name" list="add-student-datalist"
               class="w3-input w3-border w3-margin-bottom" placeholder="Start typing name…" autocomplete="off">
        <datalist id="add-student-datalist"></datalist>

        <label class="form-label">ChattState A#</label>
        <input type="text" id="add-anum" class="w3-input w3-border w3-margin-bottom" placeholder="A0000000">

        <div class="w3-row">
          <div class="w3-col m6 w3-padding-small" style="padding-left:0;">
            <label class="form-label">Date</label>
            <input type="date" id="add-date" class="w3-input w3-border">
          </div>
          <div class="w3-col m6 w3-padding-small" style="padding-right:0;">
            <label class="form-label">Attendance Code</label>
            <select id="add-code" class="w3-select w3-border">
              <option value="U">U — Unexcused</option>
              <option value="T">T — Tardy</option>
              <option value="E">E — Excused</option>
            </select>
          </div>
        </div>

        <div class="w3-row w3-margin-top">
          <div class="w3-col m6 w3-padding-small" style="padding-left:0;">
            <label class="form-label">Class Name</label>
            <input type="text" id="add-class" class="w3-input w3-border" placeholder="e.g. English 101">
          </div>
          <div class="w3-col m6 w3-padding-small" style="padding-right:0;">
            <label class="form-label">Teacher</label>
            <input type="text" id="add-teacher" list="add-teacher-datalist"
                   class="w3-input w3-border" placeholder="Last name">
            <datalist id="add-teacher-datalist"></datalist>
          </div>
        </div>

        <label class="form-label w3-margin-top">Comment (optional)</label>
        <textarea id="add-comment" class="w3-input w3-border w3-margin-bottom" rows="2"
                  placeholder="Notes…"></textarea>

        <div class="w3-row">
          <div class="w3-col m6 w3-padding-small" style="padding-left:0;">
            <button id="add-record-save-btn" class="w3-button btn-primary w3-block" onclick="saveNewRecord()">
              <i class="fas fa-save"></i> Save Record
            </button>
          </div>
          <div class="w3-col m6 w3-padding-small" style="padding-right:0;">
            <button class="w3-button btn-ghost w3-block" onclick="closeAddRecordModal()">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" style="position:fixed;bottom:20px;right:20px;z-index:9999;"></div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script type="module">
    import { initAuth, getCurrentUser } from './js/auth.js';
    import { getAll, updateDoc, addDoc, deleteDoc } from './js/db.js';
    import { initNav }                  from './js/nav.js';
    import { formatDate, exportCSV, showToast } from './js/utils.js';

    let currentUser = null;
    let allLogs     = [];   // merged classAttendanceLogs + dailyAttendanceLogs with code T/U/E
    let allLabLogs  = [];   // classAttendanceLogs with learningLab:true
    let filtered    = [];
    let attTable    = null;

    initAuth().then(user => {
      currentUser = user;
      initNav('daily-attendance');
      init();
    });

    async function init() {
      try {
        document.getElementById('loading-container').style.display = 'flex';

        // Load both attendance collections in parallel
        const [rawClass, rawDaily] = await Promise.all([
          getAll('classAttendanceLogs'),
          getAll('dailyAttendanceLogs')
        ]);

        // Tag each record with its source collection so excuse saves go to the right place
        const classMapped = rawClass.map(l => ({ ...l, _collection: 'classAttendanceLogs' }));
        const dailyMapped = rawDaily.map(l => ({ ...l, _collection: 'dailyAttendanceLogs' }));

        // Class-based T/U/E records
        const classLogs = classMapped.filter(l => ['T','U','E'].includes(l.attendanceCode));

        // Manually-logged T/U/E records from the Students page that aren't already covered
        // by a classAttendanceLogs entry for the same student+date
        const classKeys = new Set(
          classLogs.map(l => `${l.chattStateANumber}|${l.classDate || l.date || ''}`)
        );
        const dailyLogs = dailyMapped.filter(l => {
          if (!['T','U','E'].includes(l.attendanceCode)) return false;
          const d   = l.absenceDate || l.date || '';
          const key = `${l.chattStateANumber}|${d}`;
          return !classKeys.has(key); // omit if already in classAttendanceLogs for same student+date
        });

        // Merge — class records first (they have richer class/teacher info)
        allLogs = [...classLogs, ...dailyLogs];

        // Learning lab entries
        allLabLogs = classMapped.filter(l => l.learningLab === true);

        document.getElementById('loading-container').style.display = 'none';

        populateTeacherFilter();
        applyFilters();
        attachEvents();
      } catch(e) {
        console.error(e);
        showToast('Error loading attendance data', 'error');
        document.getElementById('loading-container').style.display = 'none';
      }
    }

    function populateTeacherFilter() {
      const teachers = [...new Set(
        [...allLogs, ...allLabLogs].map(l => l.teacherLastName).filter(Boolean)
      )].sort();
      const sel = document.getElementById('filter-teacher');
      teachers.forEach(t => {
        const o = document.createElement('option');
        o.value = t; o.textContent = t;
        sel.appendChild(o);
      });
    }

    function getDate(log) {
      return log.classDate || log.date || log.absenceDate || '';
    }

    function applyFilters() {
      const start      = document.getElementById('filter-start').value;
      const end        = document.getElementById('filter-end').value;
      const student    = document.getElementById('filter-student').value.toLowerCase();
      const teacher    = document.getElementById('filter-teacher').value;
      const code       = document.getElementById('filter-code').value;
      const includeLabs = document.getElementById('filter-include-labs').checked;

      // Standard T/U/E records (skip learning labs here to avoid duplicates)
      let base = allLogs.filter(l => {
        if (l.learningLab) return false; // lab entries handled separately
        const d = getDate(l);
        if (start && d < start) return false;
        if (end   && d > end)   return false;
        if (code  && l.attendanceCode !== code) return false;
        if (teacher && l.teacherLastName !== teacher) return false;
        if (student) {
          const name = (l.studentName || '').toLowerCase();
          const aNum = (l.chattStateANumber || '').toLowerCase();
          if (!name.includes(student) && !aNum.includes(student)) return false;
        }
        return true;
      });

      // Learning lab entries (when toggle is on)
      let labEntries = [];
      if (includeLabs) {
        // Require a date filter when labs are included to avoid thousands of records
        const effectiveStart = start || new Date().toISOString().split('T')[0];
        const effectiveEnd   = end   || new Date().toISOString().split('T')[0];
        if (!start) document.getElementById('filter-start').value = effectiveStart;
        if (!end)   document.getElementById('filter-end').value   = effectiveEnd;

        labEntries = allLabLogs.filter(l => {
          const d = getDate(l);
          if (d < effectiveStart || d > effectiveEnd) return false;
          if (teacher && l.teacherLastName !== teacher) return false;
          if (student) {
            const name = (l.studentName || '').toLowerCase();
            const aNum = (l.chattStateANumber || '').toLowerCase();
            if (!name.includes(student) && !aNum.includes(student)) return false;
          }
          // If code filter is active, only show lab entries with that code (or all labs if no code filter)
          if (code && l.attendanceCode !== code) return false;
          return true;
        });
      }

      filtered = [...base, ...labEntries]
        .sort((a, b) => getDate(b).localeCompare(getDate(a)));

      // Show/hide labs stat card
      document.getElementById('stat-lab-card').style.display = includeLabs ? '' : 'none';

      updateStats(labEntries);
      renderTable();
    }

    function updateStats(labEntries = []) {
      document.getElementById('stat-total').textContent     = filtered.length;
      document.getElementById('stat-unexcused').textContent = filtered.filter(l => l.attendanceCode === 'U').length;
      document.getElementById('stat-tardy').textContent     = filtered.filter(l => l.attendanceCode === 'T').length;
      // Excused = code E, or any record with PE/DE excuse
      document.getElementById('stat-excused').textContent   = filtered.filter(l =>
        l.attendanceCode === 'E' || l.excuseType === 'PE' || l.excuseType === 'DE'
      ).length;
      document.getElementById('stat-lab').textContent = labEntries.length;
    }

    function codeBadge(code, isLab) {
      const map = { U: 'code-U', T: 'code-T', E: 'code-E', P: '' };
      if (isLab) {
        return `<span class="code-badge ${map[code] || 'code-Lab'}">⭐ Lab/${code}</span>`;
      }
      return `<span class="code-badge ${map[code] || ''}">${code}</span>`;
    }

    function excuseBadge(log) {
      if (log.excuseType === 'PE') return `<span class="excuse-PE">PE</span>`;
      if (log.excuseType === 'DE') return `<span class="excuse-DE">DE</span>`;
      return '—';
    }

    function renderTable() {
      if (attTable) { attTable.destroy(); attTable = null; }
      const tbody = document.getElementById('attendance-tbody');
      tbody.innerHTML = '';

      filtered.forEach(log => {
        const d = getDate(log);
        const isLab = log.learningLab === true;
        const row = document.createElement('tr');
        // Row highlight
        if (isLab) {
          row.className = 'lab-row';
        } else if (log.attendanceCode === 'U' && !log.excuseType) {
          row.style.background = '#fff5f5';
        }
        // For lab entries still pending (?) the Excuse button is less relevant
        const actionBtns = (isLab && log.attendanceCode === '?')
          ? `<a class="w3-button w3-small w3-purple action-button" href="class-attendance.html" title="Take attendance in Class Attendance">
               <i class="fas fa-flask"></i> Take Att.
             </a>`
          : `<div style="display:flex;gap:4px;flex-wrap:wrap;">
               <button class="w3-button w3-small w3-blue action-button" onclick="openExcuseModal('${log.id}')" title="Add/edit excuse">
                 <i class="fas fa-file-medical"></i>
               </button>
               <button class="w3-button w3-small w3-green action-button" onclick="openEditRecordModal('${log.id}')" title="Edit record">
                 <i class="fas fa-pencil-alt"></i>
               </button>
               <button class="w3-button w3-small w3-red action-button" onclick="confirmDeleteRecord('${log.id}')" title="Delete record">
                 <i class="fas fa-trash"></i>
               </button>
             </div>`;
        row.innerHTML = `
          <td>${formatDate(d)}</td>
          <td style="font-weight:600;">${log.studentName || '—'}${isLab ? ' <span class="lab-badge"><i class="fas fa-flask"></i> Lab</span>' : ''}</td>
          <td>${log.chattStateANumber || '—'}</td>
          <td>${codeBadge(log.attendanceCode, isLab)}</td>
          <td>${log.className || '—'}</td>
          <td>${log.teacherLastName || '—'}</td>
          <td id="excuse-cell-${log.id}">${excuseBadge(log)}</td>
          <td style="font-size:12px;color:#64748b;">${log.comment || log.excuseNotes || '—'}</td>
          <td>${actionBtns}</td>
        `;
        tbody.appendChild(row);
      });

      attTable = $('#attendanceTable').DataTable({
        paging: true,
        pageLength: 50,
        ordering: true,
        searching: true,
        destroy: true,
        columnDefs: [{ orderable: false, targets: [8] }]
      });
    }

    function attachEvents() {
      document.getElementById('btn-apply').addEventListener('click', applyFilters);
      document.getElementById('filter-include-labs').addEventListener('change', applyFilters);
      document.getElementById('btn-clear').addEventListener('click', () => {
        document.getElementById('filter-start').value        = '';
        document.getElementById('filter-end').value          = '';
        document.getElementById('filter-student').value      = '';
        document.getElementById('filter-teacher').value      = '';
        document.getElementById('filter-code').value         = '';
        document.getElementById('filter-include-labs').checked = false;
        applyFilters();
      });
      document.getElementById('btn-download-csv').addEventListener('click', downloadCSV);
    }

    // ── Excuse Modal ─────────────────────────────────────────────────────────

    window.openExcuseModal = function(logId) {
      const log = allLogs.find(l => l.id === logId);
      if (!log) return;
      document.getElementById('excuse-log-id').value = logId;
      document.getElementById('excuse-student-info').textContent =
        `${log.studentName || ''}  ·  ${formatDate(getDate(log))}  ·  ${log.className || ''}  [${log.attendanceCode}]`;
      // Set radio
      document.querySelectorAll('input[name="excuseType"]').forEach(r => {
        r.checked = (r.value === (log.excuseType || ''));
      });
      document.getElementById('excuse-notes').value = log.excuseNotes || '';
      document.getElementById('excuseModal').style.display = 'block';
    };

    window.closeExcuseModal = function() {
      document.getElementById('excuseModal').style.display = 'none';
    };

    window.saveExcuse = async function() {
      const logId     = document.getElementById('excuse-log-id').value;
      const excuseType = document.querySelector('input[name="excuseType"]:checked')?.value || '';
      const excuseNotes = document.getElementById('excuse-notes').value.trim();

      const log  = allLogs.find(l => l.id === logId);
      const coll = log?._collection || 'classAttendanceLogs';

      try {
        await updateDoc(coll, logId, { excuseType, excuseNotes });

        // Update local cache (log already found above)
        if (log) { log.excuseType = excuseType; log.excuseNotes = excuseNotes; }

        // Update cell without full re-render
        const cell = document.getElementById(`excuse-cell-${logId}`);
        if (cell) cell.innerHTML = excuseBadge(log);

        updateStats();
        showToast(excuseType ? `Excuse (${excuseType}) saved` : 'Excuse removed', 'success');
        closeExcuseModal();
      } catch(e) {
        console.error(e);
        showToast('Error saving excuse', 'error');
      }
    };

    // ── Add Record Modal ─────────────────────────────────────────────────────

    let studentsForAdd = null;

    window.openAddRecordModal = async function() {
      // Lazy-load students for autocomplete
      if (!studentsForAdd) {
        try {
          studentsForAdd = await getAll('students');
          const dl = document.getElementById('add-student-datalist');
          dl.innerHTML = '';
          [...studentsForAdd]
            .sort((a, b) => (a.lastName || '').localeCompare(b.lastName || ''))
            .forEach(s => {
              const opt = document.createElement('option');
              opt.value = `${s.lastName}, ${s.firstName}`;
              dl.appendChild(opt);
            });
        } catch(e) { console.error(e); }
      }

      // Populate teacher datalist from loaded logs
      const teacherDl = document.getElementById('add-teacher-datalist');
      teacherDl.innerHTML = '';
      [...new Set([...allLogs, ...allLabLogs].map(l => l.teacherLastName).filter(Boolean))]
        .sort()
        .forEach(t => {
          const opt = document.createElement('option');
          opt.value = t;
          teacherDl.appendChild(opt);
        });

      // Reset to "add" mode
      document.getElementById('edit-record-id').value = '';
      document.getElementById('add-record-title').innerHTML = '<i class="fas fa-plus-circle"></i> Log Attendance Record';
      document.getElementById('add-record-save-btn').innerHTML = '<i class="fas fa-save"></i> Save Record';
      document.getElementById('add-student-name').disabled = false;
      document.getElementById('add-anum').disabled = false;

      // Defaults
      document.getElementById('add-date').value    = new Date().toISOString().split('T')[0];
      document.getElementById('add-student-name').value = '';
      document.getElementById('add-anum').value    = '';
      document.getElementById('add-code').value    = 'U';
      document.getElementById('add-class').value   = '';
      document.getElementById('add-teacher').value = '';
      document.getElementById('add-comment').value = '';

      document.getElementById('addRecordModal').style.display = 'block';
    };

    window.closeAddRecordModal = function() {
      document.getElementById('addRecordModal').style.display = 'none';
      document.getElementById('edit-record-id').value = '';
    };

    // Open modal pre-filled for editing an existing record
    window.openEditRecordModal = async function(logId) {
      const log = allLogs.find(l => l.id === logId);
      if (!log) return;

      // Lazy-load students for autocomplete (same as add modal)
      if (!studentsForAdd) {
        try {
          studentsForAdd = await getAll('students');
          const dl = document.getElementById('add-student-datalist');
          dl.innerHTML = '';
          [...studentsForAdd]
            .sort((a, b) => (a.lastName || '').localeCompare(b.lastName || ''))
            .forEach(s => {
              const opt = document.createElement('option');
              opt.value = `${s.lastName}, ${s.firstName}`;
              dl.appendChild(opt);
            });
        } catch(e) { console.error(e); }
      }

      document.getElementById('edit-record-id').value = logId;
      document.getElementById('add-record-title').innerHTML = '<i class="fas fa-pencil-alt"></i> Edit Attendance Record';
      document.getElementById('add-record-save-btn').innerHTML = '<i class="fas fa-save"></i> Update Record';

      // Pre-fill fields (student name/A# locked since identity shouldn't change)
      document.getElementById('add-student-name').value = log.studentName || '';
      document.getElementById('add-student-name').disabled = true;
      document.getElementById('add-anum').value = log.chattStateANumber || '';
      document.getElementById('add-anum').disabled = true;
      document.getElementById('add-date').value  = getDate(log).substring(0, 10);
      document.getElementById('add-code').value  = log.attendanceCode || 'U';
      document.getElementById('add-class').value = log.className || '';
      document.getElementById('add-teacher').value = log.teacherLastName || '';
      document.getElementById('add-comment').value = log.comment || '';

      document.getElementById('addRecordModal').style.display = 'block';
    };

    // Auto-fill A# when a student is picked from the datalist
    document.getElementById('add-student-name').addEventListener('input', function() {
      if (!studentsForAdd) return;
      const val = this.value.trim();
      const match = studentsForAdd.find(s => `${s.lastName}, ${s.firstName}` === val);
      if (match) document.getElementById('add-anum').value = match.chattStateANumber || '';
    });

    window.saveNewRecord = async function() {
      const editId      = document.getElementById('edit-record-id').value;
      const studentName = document.getElementById('add-student-name').value.trim();
      const anum        = document.getElementById('add-anum').value.trim();
      const date        = document.getElementById('add-date').value;
      const code        = document.getElementById('add-code').value;
      const className   = document.getElementById('add-class').value.trim();
      const teacher     = document.getElementById('add-teacher').value.trim();
      const comment     = document.getElementById('add-comment').value.trim();

      if (!studentName || !anum || !date || !code) {
        showToast('Student name, A#, date, and code are required', 'warning');
        return;
      }

      if (editId) {
        // ── EDIT existing record ──────────────────────────────────────────────
        const log  = allLogs.find(l => l.id === editId);
        const coll = log?._collection || 'classAttendanceLogs';
        const changes = {
          attendanceCode: code,
          classDate:      date,
          date,
          className:      className || '',
          teacherLastName: teacher  || '',
          comment:        comment   || '',
          updatedAt:      new Date().toISOString(),
        };
        try {
          await updateDoc(coll, editId, changes);
          if (log) Object.assign(log, changes);
          populateTeacherFilter();
          applyFilters();
          closeAddRecordModal();
          showToast('Record updated', 'success');
        } catch(e) {
          console.error(e);
          showToast('Error updating record', 'error');
        }
      } else {
        // ── ADD new record ────────────────────────────────────────────────────
        const record = {
          studentName,
          chattStateANumber: anum,
          classDate:         date,
          date,
          attendanceCode:    code,
          className:         className  || '',
          teacherLastName:   teacher    || '',
          comment:           comment    || '',
          staffName:         currentUser?.displayName || currentUser?.email || 'Staff',
          createdAt:         new Date().toISOString(),
        };
        try {
          const id = await addDoc('classAttendanceLogs', record);
          record.id = id;
          allLogs.push(record);
          populateTeacherFilter();
          applyFilters();
          closeAddRecordModal();
          showToast('Attendance record saved', 'success');
        } catch(e) {
          console.error(e);
          showToast('Error saving record', 'error');
        }
      }
    };

    // ── Delete Record ────────────────────────────────────────────────────────

    window.confirmDeleteRecord = function(logId) {
      const log = allLogs.find(l => l.id === logId);
      if (!log) return;
      const info = `${log.studentName || 'Unknown'} — ${formatDate(getDate(log))} [${log.attendanceCode}]`;
      if (!confirm(`Delete this absence record?\n\n${info}\n\nThis cannot be undone.`)) return;
      deleteAbsenceRecord(logId);
    };

    async function deleteAbsenceRecord(logId) {
      const log  = allLogs.find(l => l.id === logId);
      const coll = log?._collection || 'classAttendanceLogs';
      try {
        await deleteDoc(coll, logId);
        allLogs = allLogs.filter(l => l.id !== logId);
        applyFilters();
        showToast('Record deleted', 'success');
      } catch(e) {
        console.error(e);
        showToast('Error deleting record', 'error');
      }
    };

    // ── CSV Download ─────────────────────────────────────────────────────────

    function downloadCSV() {
      if (filtered.length === 0) { showToast('No records to download', 'warning'); return; }
      const data = filtered.map(l => ({
        'Date':        formatDate(getDate(l)),
        'Student':     l.studentName || '',
        'A#':          l.chattStateANumber || '',
        'Code':        l.attendanceCode,
        'Type':        l.learningLab ? 'Learning Lab' : 'Regular',
        'Class':       l.className || '',
        'Teacher':     l.teacherLastName || '',
        'Excuse':      l.excuseType || '',
        'Excuse Notes': l.excuseNotes || '',
        'Comment':     l.comment || ''
      }));
      exportCSV(data, 'daily-attendance.csv');
    }
  </script>
</body>
</html>
